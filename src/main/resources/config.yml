# ====================================================== #
#               CodesSystem Configuration               #
# ====================================================== #
# SEZNAM VŠECH PERMISÍ A JEJICH POPIS:
#
# UŽIVATELSKÉ PERMISE:
# - codes.use.code : Oprávnění k použití příkazu /code <code>
# - codes.use.default : Výchozí předvolená permise pro nově vytvořené kódy
#
# ADMIN PERMISE:
# - codes.admin.gui : Přístup k administračnímu GUI (/codes) a příkazům /ecode
# - codes.admin.reset : Oprávnění k resetu kódu pro hráče (/acode reset)
# - codes.admin.reload : Oprávnění k načtení konfigurace (/acode reload)
# - codes.admin.list : Oprávnění k zobrazení seznamu kódů (/acode list)
# - codes.admin.availability : Oprávnění ke kontrole stavu kódu (/acode availability)
# - codes.admin.getcode : Oprávnění k získání aktuálního kódu (/acode getcode)
# ====================================================== #

messages:
  prefix: "<dark_gray>[<cyan>CodesSystem<dark_gray>] "
  no-permission: "%prefix%<red>Nemáš dostatečná oprávnění k použití tohoto příkazu."
  code-not-found: "%prefix%<red>Zadaný kód neexistuje."
  code-already-used: "%prefix%&cTento kód jsi již v minulosti uplatnil."
  code-ip-limit: "%prefix%<red>Tento kód byl z tvojí IP adresy již vyčerpán."
  code-global-limit: "%prefix%<red>Tento kód již dosáhl svého maximálního počtu globálních použití."
  code-success: "%prefix%<green>Kód <yellow>%code% <green>byl úspěšně uplatněn!"
  code-created: "%prefix%<green>Kód pro <yellow>%display% <green>byl úspěšně vytvořen! Otevírám GUI..."
  code-deleted: "%prefix%<red>Kód <yellow>%code% <red>byl úspěšně smazán."
  code-edited: "%prefix%<green>Hodnota <yellow>%field% <green>pro kód <yellow>%code% <green>byla upravena na: <white>%value%"
  code-reset-success: "%prefix%<green>Kód <yellow>%code% <green>byl úspěšně resetován pro hráče <yellow>%player%<green>."
  plugin-reloaded: "%prefix%<green>Konfigurace pluginu byla úspěšně znovu načtena."
  delete-confirm-prompt: "%prefix%<red>Opravdu chceš smazat kód <yellow>%code%<red>? Napiš <green>accept <red>pro potvrzení nebo <yellow>cancel <red>pro zrušení (lhůta 5 sekund)."
  delete-cancelled: "%prefix%<yellow>Mazání kódu bylo zrušeno."
  delete-timeout: "%prefix%<red>Časový limit pro potvrzení smazání vypršel."
  input-prompt: "%prefix%<green>Zadej novou hodnotu do chatu (nebo napiš <yellow>cancel <green>pro zrušení):"
  input-cancelled: "%prefix%<yellow>Zadávání bylo zrušeno."
  availability-used: "%prefix%<green>Hráč <yellow>%player% <green>JIŽ uplatnil kód <yellow>%code%<green>."
  availability-not-used: "%prefix%<red>Hráč <yellow>%player% <green>JEŠTĚ NEUPLATNIL kód <yellow>%code%<green>."
  
  # Text na obrázku (příkaz /acode getcode):
  getcode-success: "%prefix%<green>Aktuální kód pro %display% <green>je: <hover:show_text:'<yellow>Klikni pro zkopírování'><click:copy_to_clipboard:'%code%'><aqua>%code%</click></hover>"

  # Výpis seznamu kódů (/acode list)
  list-header: "%prefix%<green>Seznam aktivních kódů:"
  list-format: "<dark_gray>- <yellow>%code% <gray>(<white>%display%<gray>)"

  # Nápovědy příkazů (Help Messages)
  help-code: "%prefix%<gray>Použití: <white>/code <code>"
  help-ecode: "%prefix%<gray>Použití: <white>/ecode <create|delete|edit>"
  help-ecode-create: "%prefix%<gray>Použití: <white>/ecode create <displayName>"
  help-ecode-delete: "%prefix%<gray>Použití: <white>/ecode delete <code|displayName>"
  help-ecode-edit: "%prefix%<gray>Použití: <white>/ecode edit <code|displayName> <name|permission|uses-single|uses-global|refresh|stable-code> <hodnota>"
  help-acode: "%prefix%<gray>Použití: <white>/acode <reset|reload|list|availability|getcode>"
  help-acode-reset: "%prefix%<gray>Použití: <white>/acode reset <hráč> <kod>"
  help-acode-getcode: "%prefix%<gray>Použití: <white>/acode getcode <displayName>"
  help-acode-availability: "%prefix%<gray>Použití: <white>/acode availability <hráč> <kod>"

gui:
  main:
    title: "<dark_gray>Správa Kódů (Hlavní Menu)"
    size: 54
    create-button:
      slot: 48
      material: "EMERALD_BLOCK"
      name: "<green>+ Vytvořit Nový Kód"
      lore:
        - "<gray>Kliknutím vytvoříš nový kód"
        - "<gray>pomocí zadání do chatu."
    exhausted-button:
      slot: 50
      material: "REDSTONE_BLOCK"
      name: "<red>Vyčerpané Kódy"
      lore:
        - "<gray>Zobrazí seznam kódů,"
        - "<gray>které dosáhly globálního limitu."

  exhausted:
    title: "<dark_gray>Vyčerpané Kódy"
    size: 54
    back-button:
      slot: 49
      material: "BARRIER"
      name: "<red>Zpět"
      lore:
        - "<gray>Návrat do hlavního menu"

  editor:
    title: "<dark_gray>Úprava Kódu: %code%"
    size: 27
    items:
      name:
        slot: 9
        material: "NAME_TAG"
        title: "<yellow>Display Name"
        lore:
          - "<gray>Aktuální: <white>%value%"
          - ""
          - "<yellow>Klikni pro změnu názvu"
      permission:
        slot: 10
        material: "PAPER"
        title: "<yellow>Permise"
        lore:
          - "<gray>Aktuální: <white>%value%"
          - ""
          - "<yellow>Klikni pro změnu permise"
      command:
        slot: 11
        material: "COMMAND_BLOCK"
        title: "<yellow>Příkaz Odměny"
        lore:
          - "<gray>Aktuální: <white>%value%"
          - ""
          - "<gray>Použij <white>[console] <gray>nebo <white>[player]"
          - "<yellow>Klikni pro změnu příkazu"
      uses-single:
        slot: 12
        material: "PLAYER_HEAD"
        title: "<yellow>Limit na IP"
        lore:
          - "<gray>Aktuální limit: <white>%value%"
          - ""
          - "<yellow>Klikni pro změnu limitu na IP"
      uses-global:
        slot: 13
        material: "BEACON"
        title: "<yellow>Globální Limit"
        lore:
          - "<gray>Aktuální: <white>%used% / %max%"
          - ""
          - "<yellow>Klikni pro změnu globálního limitu"
      refresh:
        slot: 14
        material: "REPEATER"
        title: "<yellow>Auto-Refresh"
        lore:
          - "<gray>Stav: <white>%value%"
          - ""
          - "<yellow>Klikni pro přepnutí true/false"
      stable-code:
        slot: 15
        material: "ANVIL"
        title: "<yellow>Stálý Kód (Stable Code)"
        lore:
          - "<gray>Aktuální: <white>%value%"
          - ""
          - "<gray>Použije se pokud je refresh <white>false"
          - "<yellow>Klikni pro změnu stálého kódu"
      register:
        slot: 22
        material: "SLIME_BALL"
        title: "<green>Uložit a Registrovat"
        lore:
          - "<gray>Uloží všechny změny a vrátí"
          - "<gray>tě do hlavního menu."
      delete:
        slot: 26
        material: "TNT"
        title: "<red>Smazat Kód"
        lore:
          - "<gray>Trvale odstraní tento kód."
