# ====================================================== #
#               CodesSystem Configuration               #
# ====================================================== #
# SEZNAM VŠECH PERMISÍ A JEJICH POPIS:
#
# UŽIVATELSKÉ PERMISE:
# - codes.use.code : Oprávnění k použití příkazu /code <code>
# - codes.use.default : Výchozí předvolená permise pro nově vytvořené kódy
#
# ADMIN PERMISE:
# - codes.admin.gui : Přístup k administračnímu GUI (/codes) a příkazům /ecode
# - codes.admin.reset : Oprávnění k resetu kódu pro hráče (/acode reset)
# - codes.admin.reload : Oprávnění k načtení konfigurace (/acode reload)
# - codes.admin.list : Oprávnění k zobrazení seznamu kódů (/acode list)
# - codes.admin.availability : Oprávnění ke kontrole stavu kódu (/acode availability)
# - codes.admin.getcode : Oprávnění k získání aktuálního kódu (/acode getcode)
# ====================================================== #

messages:
  prefix: "&8[&bCodesSystem&8] "
  no-permission: "%prefix%&cNemáš dostatečná oprávnění k použití tohoto příkazu."
  code-not-found: "%prefix%&cZadaný kód neexistuje."
  code-already-used: "%prefix%&cTento kód jsi již v minulosti uplatnil."
  code-ip-limit: "%prefix%&cTento kód byl z tvojí IP adresy již vyčerpán."
  code-global-limit: "%prefix%&cTento kód již dosáhl svého maximálního počtu globálních použití."
  code-success: "%prefix%&aKód &e%code% &abyl úspěšně uplatněn!"
  code-created: "%prefix%&aKód pro &e%display% &abyl úspěšně vytvořen! Otevírám GUI..."
  code-deleted: "%prefix%&cKód &e%code% &abyl úspěšně smazán."
  code-edited: "%prefix%&aHodnota &e%field% &apro kód &e%code% &abyla upravena na: &f%value%"
  code-reset-success: "%prefix%&aKód &e%code% &abyl úspěšně resetován pro hráče &e%player%&a."
  plugin-reloaded: "%prefix%&aKonfigurace pluginu byla úspěšně znovu načtena."
  delete-confirm-prompt: "%prefix%&cOpravdu chceš smazat kód &e%code%&c? Napiš &aaccept &cpro potvrzení nebo &ecancel &cpro zrušení (lhůta 5 sekund)."
  delete-cancelled: "%prefix%&eMazání kódu bylo zrušeno."
  delete-timeout: "%prefix%&cČasový limit pro potvrzení smazání vypršel."
  input-prompt: "%prefix%&aZadej novou hodnotu do chatu (nebo napiš &ecancel &apro zrušení):"
  input-cancelled: "%prefix%&eZadávání bylo zrušeno."
  availability-used: "%prefix%&aHráč &e%player% &aJIŽ uplatnil kód &e%code%&a."
  availability-not-used: "%prefix%&cHráč &e%player% &aJEŠTĚ NEUPLATNIL kód &e%code%&a."
  
  # Text příkazu /acode getcode (kliknutím zkopíruje kód do schránky):
  getcode-success: "%prefix%&aAktuální kód pro &e%display% &aje: <hover:show_text:'&eKlikni pro zkopíruání'><click:copy_to_clipboard:'%code%'>&b%code%</click></hover>"

  # Výpis seznamu kódů (/acode list)
  list-header: "%prefix%&aSeznam aktivních kódů:"
  list-format: "&8- &e%code% &7(&f%display%&7)"

  # Nápovědy příkazů (Help Messages)
  help-code: "%prefix%&7Použití: &f/code <code>"
  help-ecode: "%prefix%&7Použití: &f/ecode <create|delete|edit>"
  help-ecode-create: "%prefix%&7Použití: &f/ecode create <displayName>"
  help-ecode-delete: "%prefix%&7Použití: &f/ecode delete <code|displayName>"
  help-ecode-edit: "%prefix%&7Použití: &f/ecode edit <code|displayName> <name|permission|uses-single|uses-global|refresh|stable-code> <hodnota>"
  help-acode: "%prefix%&7Použití: &f/acode <reset|reload|list|availability|getcode>"
  help-acode-reset: "%prefix%&7Použití: &f/acode reset <hráč> <kod>"
  help-acode-getcode: "%prefix%&7Použití: &f/acode getcode <displayName>"
  help-acode-availability: "%prefix%&7Použití: &f/acode availability <hráč> <kod>"

gui:
  main:
    title: "&8Správa Kódů (Hlavní Menu)"
    size: 54
    create-button:
      slot: 48
      material: "EMERALD_BLOCK"
      name: "&a+ Vytvořit Nový Kód"
      lore:
        - "&7Kliknutím vytvoříš nový kód"
        - "&7pomocí zadání do chatu."
    exhausted-button:
      slot: 50
      material: "REDSTONE_BLOCK"
      name: "&cVyčerpané Kódy"
      lore:
        - "&7Zobrazí seznam kódů,"
        - "&7které dosáhly globálního limitu."

  exhausted:
    title: "&8Vyčerpané Kódy"
    size: 54
    back-button:
      slot: 49
      material: "BARRIER"
      name: "&cZpět"
      lore:
        - "&7Návrat do hlavního menu"

  editor:
    title: "&8Úprava Kódu: %code%"
    size: 27
    items:
      name:
        slot: 9
        material: "NAME_TAG"
        title: "&eDisplay Name"
        lore:
          - "&7Aktuální: &f%value%"
          - ""
          - "&eKlikni pro změnu názvu"
      permission:
        slot: 10
        material: "PAPER"
        title: "&ePermise"
        lore:
          - "&7Aktuální: &f%value%"
          - ""
          - "&eKlikni pro změnu permise"
      command:
        slot: 11
        material: "COMMAND_BLOCK"
        title: "&ePříkaz Odměny"
        lore:
          - "&7Aktuální: &f%value%"
          - ""
          - "&7Použij &f[console] &7nebo &f[player]"
          - "&eKlikni pro změnu příkazu"
      uses-single:
        slot: 12
        material: "PLAYER_HEAD"
        title: "&eLimit na IP"
        lore:
          - "&7Aktuální limit: &f%value%"
          - ""
          - "&eKlikni pro změnu limitu na IP"
      uses-global:
        slot: 13
        material: "BEACON"
        title: "&eGlobální Limit"
        lore:
          - "&7Aktuální: &f%used% / %max%"
          - ""
          - "&eKlikni pro změnu globálního limitu"
      refresh:
        slot: 14
        material: "REPEATER"
        title: "&eAuto-Refresh"
        lore:
          - "&7Stav: &f%value%"
          - ""
          - "&eKlikni pro přepnutí true/false"
      stable-code:
        slot: 15
        material: "ANVIL"
        title: "&eStálý Kód (Stable Code)"
        lore:
          - "&7Aktuální: &f%value%"
          - ""
          - "&7Použije se pokud je refresh &ffalse"
          - "&eKlikni pro změnu stálého kódu"
      register:
        slot: 22
        material: "SLIME_BALL"
        title: "&aUložit a Registrovat"
        lore:
          - "&7Uloží všechny změny a vrátí"
          - "&7tě do hlavního menu."
      delete:
        slot: 26
        material: "TNT"
        title: "&cSmazat Kód"
        lore:
          - "&7Trvale odstraní tento kód."
